name: Daily AI Post Generation

on:
  schedule:
    # 每天配置分散的时间点（Cron 触发时间点带有随机分钟数，避免整点）
    - cron: '27 1 * * *'   # 约北京时间 09:27
    - cron: '14 4 * * *'   # 约北京时间 12:14
    - cron: '08 7 * * *'   # 约北京时间 15:08
    - cron: '53 9 * * *'   # 约北京时间 17:53
    - cron: '31 12 * * *'  # 约北京时间 20:31
    - cron: '19 15 * * *'  # 约北京时间 23:19
  workflow_dispatch: # 手动触发按钮

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run AI Auto Post Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 传递触发事件类型
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/auto_post.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add src/content/blog/
          git diff --staged --quiet || (git commit -m "docs: publish daily health research post" && git push)
