name: Daily AI Post Generation

on:
  schedule:
    # cron 表达式：每天 UTC 时间 0:00（即北京时间早上 8:00）自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 界面手动点击运行测试

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Run AI Auto Post Agent
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python scripts/auto_post.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add src/content/blog/
        
        # 检查是否有新文件添加，如果有则提交
        if git diff --staged --quiet; then
          echo "No new post generated."
        else
          git commit -m "chore: auto-generate daily SEO blog post [skip ci]"
          git push
        fi
