name: Daily AI Post Generation

on:
  schedule:
    # 每天北京时间早上 8:00（UTC 0:00）运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击触发

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Run AI Auto Post Agent
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        python scripts/auto_post.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add src/content/blog/
        
        if git diff --staged --quiet; then
          echo "No new post generated."
        else
          git commit -m "chore: auto-generate daily SEO blog post [skip ci]"
          git push
        fi
